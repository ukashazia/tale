name: Publish Debian packages

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: arm64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Generate command-line artifacts
        run: cargo run --locked --bin generate-artifacts -- --output-dir .

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Assemble Debian package
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          version=${VERSION#v}
          output="tale_${version}_${ARCHITECTURE}.deb"
          packaging/debian/package-deb.sh \
            --binary "target/$TARGET/release/tale" \
            --target "$TARGET" \
            --version "$version" \
            --output "$output"
          shasum -a 256 "$output" > "$output.sha256"

      - name: Upload Debian package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./*.deb ./*.deb.sha256 --clobber
