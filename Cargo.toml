[package]
name = "tale"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
bytes = "1"
clap = { version = "4.6.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
clap_complete = "4.6.8"
clap_mangen = "0.3.0"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std", "preserve_order"] }
sha2 = "0.10"
shlex = "2.0.1"
similar = "3.1.1"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "display", "std"] }
time = { version = "0.3", default-features = false, features = ["formatting", "parsing"] }
url = "2"
zeroize = "1"
keyring = "3"
libc = "0.2"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }

[dev-dependencies]
criterion = "0.8.2"
syn = { version = "2.0", features = ["full", "visit"] }

[[bench]]
name = "phase9"
harness = false
