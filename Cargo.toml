[package]
name = "tale"
version = "2.0.6"
edition = "2024"
description = "Keyboard-first terminal application for Tailscale networks"
homepage = "https://github.com/ukashazia/tale"
repository = "https://github.com/ukashazia/tale"
license = "MIT"
readme = "README.md"

[workspace]
resolver = "2"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Checksums to generate for each App
checksum = "sha256"
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["NOTICE", "docs/cli/tale.1", "completions"]
# A GitHub repo to push Homebrew formulas to
tap = "ukashazia/homebrew-tale"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Pin generated GitHub Actions dependencies to immutable revisions.
[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"

[package.metadata.dist.binaries]
aarch64-apple-darwin = ["tale"]
x86_64-apple-darwin = ["tale"]
aarch64-unknown-linux-gnu = ["tale"]
x86_64-unknown-linux-gnu = ["tale"]

[dependencies]
arboard = { version = "3.6.1", default-features = false }
bytes = "1"
clap = { version = "4.6.5", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
clap_complete = "4.6.8"
clap_mangen = "0.3.0"
crossterm = { version = "0.29.0", default-features = false, features = [
  "bracketed-paste",
  "events",
] }
fjson = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm_0_29",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
rpassword = "7"
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.145", default-features = false, features = [
  "std",
  "preserve_order",
] }
sha2 = "0.10"
shlex = "2.0.1"
similar = "3.1.1"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "test-util",
  "time",
] }
toml = { version = "1.1.4", default-features = false, features = [
  "parse",
  "serde",
  "display",
  "std",
] }
time = { version = "0.3", default-features = false, features = [
  "formatting",
  "parsing",
] }
url = "2"
zeroize = "1"
libc = "0.2"
nucleo-matcher = "0.3.1"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", default-features = false, features = [
  "client",
  "http1",
] }
hyper-util = { version = "0.1.20", default-features = false, features = [
  "tokio",
] }

[dev-dependencies]
criterion = "0.8.2"
syn = { version = "2.0", features = ["full", "visit"] }

[[bench]]
name = "performance"
harness = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
